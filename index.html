<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card-container">
        <!-- Top decorative banner -->
        <div class="card-header"></div>

        <!-- Profile details -->
        <div class="card-body">
            <div class="avatar-wrapper">
                <img src="TejaSanges.jpg" alt="Profile Picture" class="avatar">
            </div>

            <h2 class="profile-name">Tejeshwar</h2>
            <p class="profile-title">Web Development Student</p>
            <p class="profile-bio">
                Passionate about learning front-end web development, building interactive layouts, and experimenting with modern CSS animations.
            </p>

            <!-- Interactive Stats -->
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-number">12</span>
                    <span class="stat-label">Projects</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">1.2k</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number">45</span>
                    <span class="stat-label">Code Repos</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary">Follow</button>
                <button class="btn btn-secondary">Message</button>
            </div>
        </div>
    </main>

</body>
</html>
